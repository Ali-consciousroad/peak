<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="peakGradient" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#5B21B6;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#818CF8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A5B4FC;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="snowGradient" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F1F5F9;stop-opacity:0.95" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main peak - elegant Damavand-inspired shape with refined proportions -->
  <path d="M 60 10 L 20 105 L 100 105 Z" fill="url(#peakGradient)" filter="url(#shadow)"/>
  
  <!-- Snow cap - clean minimalist detail -->
  <path d="M 60 10 L 44 65 L 76 65 Z" fill="url(#snowGradient)"/>
  
  <!-- Subtle highlight on left side -->
  <path d="M 60 10 L 20 105 L 60 105 Z" fill="#FFFFFF" opacity="0.15"/>
</svg>
